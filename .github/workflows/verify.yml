name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# verify 只读仓库；不写 issue、不评论、不发布。
permissions:
  contents: read

# 同一 ref 只保留最新一次运行。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # e2e 与 pack 都会真启动 dsh 并调用 pnpm；job 要比它们自己的超时（300s / 90s）更宽裕。
    timeout-minutes: 45
    strategy:
      # 一个平台挂了也要看到另一个平台的结果。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dsh 的 plugin manager 用 execa 直接 spawn("pnpm")。
      # Windows 上 corepack 给的是 pnpm.cmd shim，非 shell 的 spawn 找不到它；
      # pnpm/action-setup 装的是独立可执行文件，两个平台都能被 execa 直接拉起。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      # Node 24：dsh 0.2.1-rc.2 自带运行时就是 Node 24.21.0，本机两套 verify 均在它上面通过；
      # 2026-10 时 24 是 Active LTS（22 已进维护期），依赖里最严的 engines 是 >=22.19。
      # 仓库没有 lockfile，所以 setup-node 不开 cache（pnpm cache 需要 lockfile）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      # 装在仓库外的 runner 临时目录，不改 checkout 里的 package.json，也不引入 node_modules。
      # Windows: D:\a\_temp\dsh-install；Ubuntu: /home/runner/work/_temp/dsh-install。
      - name: Prepare temp install dir
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path');const dir=path.join(process.env.RUNNER_TEMP,'dsh-install');fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify({name:'dsh-ci-probe',private:true},null,2));console.log('install dir: '+dir)"

      # --ignore-scripts：pnpm 会拦下 koffi / node-pty / protobufjs 的 build script 并以
      # ERR_PNPM_IGNORED_BUILDS 结束（Windows 上实测 exit 1，但包其实已装好）。dsh 发布包的
      # lib/ 是预构建的，verify 只需要 lib/bin.js，所以用 --ignore-scripts 让退出码确定，
      # 而不是「允许失败 + 猜产物有没有装好」。下一步断言 lib/bin.js 真的存在。
      - name: Install dsh
        working-directory: ${{ runner.temp }}/dsh-install
        run: pnpm add --ignore-scripts "@deepseek-ai/dsh@0.2.1-rc.2"

      # DSH_BIN 用 pnpm 的 junction 路径即可：verify/dsh-bin.mjs 会用 realpathSync.native
      # 解析到 .pnpm 里的真实路径。直接 spawn junction 会让 dsh 找不到 dsh-app-boot。
      - name: Check dsh install and export DSH_BIN
        env:
          DSH_INSTALL_BIN: ${{ runner.temp }}/dsh-install/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path');const bin=process.env.DSH_INSTALL_BIN;if(!fs.existsSync(bin)){console.error('dsh entry point missing: '+bin);process.exit(1)};const pkg=JSON.parse(fs.readFileSync(path.join(path.dirname(path.dirname(bin)),'package.json'),'utf8'));fs.appendFileSync(process.env.GITHUB_ENV,'DSH_BIN='+bin+String.fromCharCode(10));console.log('dsh '+pkg.version);console.log('DSH_BIN='+bin);console.log('resolved='+fs.realpathSync.native(bin))"

      # 证明装出来的 dsh 真的能启动，而不只是文件存在。先 realpath 再 spawn：
      # junction 路径直跑时 dsh 解析不到自己的依赖（见上一步注释）。
      - name: Check dsh boots
        run: |
          node -e "const fs=require('node:fs'),cp=require('node:child_process');const real=fs.realpathSync.native(process.env.DSH_BIN);console.log('resolved='+real);cp.execFileSync(process.execPath,[real,'--version'],{stdio:'inherit'})"

      # bash 的 pipefail + tee：原始输出同时进 step 日志和 artifact。
      # continue-on-error 是为了三套都跑完（另一套的原始输出也要能看到），
      # 最终由 Report and gate 统一决定 job 红不红。
      # 步骤名不写项数：断言数量会变，名字留着旧数字比没有更误导。
      - name: Verify — smoke
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node verify/smoke.mjs 2>&1 | tee verify-smoke.log

      # day-report 与 smoke 一样不需要 dsh：纯本地文件 + store.js。
      # 放在需要 dsh 的套件之前，坏掉时能早几秒给结论。
      - name: Verify — day report
        id: dayreport
        continue-on-error: true
        run: |
          node verify/day-report.mjs 2>&1 | tee verify-day-report.log

      # demo-data：对外页面（docs/index.html、docs/scenarios.html）上的数字全部
      # 由 docs/assets/life-demo.json 渲染，这一套断言那份产物与当前实现一致。
      # 它不需要 dsh，但**必须**两个平台都跑：产物里含按本地日历日切分的日期，
      # 跨平台差异（时区、换行）正是它最容易出事的地方。
      - name: Verify — demo data
        id: demodata
        continue-on-error: true
        run: |
          node verify/demo-data.mjs 2>&1 | tee verify-demo-data.log

      # claims：文档里那些「必须等于实测」的数字，以及不许回流的旧值。
      # 它自己会调 tools/facts.mjs 重新量一遍并逐字比对生成块 ——
      # 所以它必须跑在其它套件**之后**：项数是它要比对的事实之一。
      - name: Verify — claims
        id: claims
        continue-on-error: true
        run: |
          node verify/claims.mjs 2>&1 | tee verify-claims.log

      # life-week 同样不需要 dsh：它把七天压缩跑完，用的是生产的 store/choose/wake。
      # 它是「连续七天」这个说法的证据（PRODUCT.md §6 阶段 A），所以必须每平台都跑 ——
      # 跨平台差异（路径、时区）正是它最容易出事的地方。
      - name: Verify — life week
        id: lifeweek
        continue-on-error: true
        run: |
          node verify/life-week.mjs 2>&1 | tee verify-life-week.log

      # verify/ 里的 ui 套件：不需要浏览器，验包清单、桩 loader 注册、host 路由与
      # 「私密内容不出 Host」。放在 pack 之前 —— 它便宜，且 `files` 与 client 入口
      # 一旦写错，pack 那套会跟着红，先看到 ui 的结论更好定位。
      - name: Verify — ui
        id: ui
        continue-on-error: true
        run: |
          node verify/ui.mjs 2>&1 | tee verify-ui.log

      # 发布线：状态机 / 标识硬闸 / approval 四态 / TOCTOU / Telegram 载荷与脱敏。
      # 全程假 approval + 假 fetch，**不发任何真实网络请求**。
      - name: Verify — publish
        id: publish
        continue-on-error: true
        run: |
          node verify/publish.mjs 2>&1 | tee verify-publish.log

      # 打包检查放在 e2e 前面：它先跑 pnpm pack 与文件清单，漏文件这类问题在几秒内
      # 就有结论，不必等慢的 e2e。所有套件都跑（continue-on-error），总时长不变。
      - name: Verify — pack
        id: pack
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node verify/pack-install.mjs 2>&1 | tee verify-pack.log

      - name: Verify — e2e
        id: e2e
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node verify/e2e-tools.mjs 2>&1 | tee verify-e2e.log

      # 数字纪律：证明文档里的数字与代码/真跑一致。
      # 它必须排在所有套件之后 —— 它要读它们的真实项数来比对生成块。
      # 放在 Windows 上也跑，正是因为它拦的是一类跨平台看不出来的东西（手抄的数字）。
      - name: Verify — claims
        id: claims
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node verify/claims.mjs 2>&1 | tee verify-claims.log

      # 汇总 dsh / node 版本、各套结果与输出尾部：写 step summary + verify-report.md，
      # 并作为 job 的最终闸门（全部 success 才放行）。
      - name: Report and gate
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DAYREPORT_OUTCOME: ${{ steps.dayreport.outcome }}
          DEMODATA_OUTCOME: ${{ steps.demodata.outcome }}
          CLAIMS_OUTCOME: ${{ steps.claims.outcome }}
          LIFEWEEK_OUTCOME: ${{ steps.lifeweek.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          CLAIMS_OUTCOME: ${{ steps.claims.outcome }}
        run: node .github/scripts/ci-report.mjs

      - name: Upload verify logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ matrix.os }}
          path: |
            verify-smoke.log
            verify-day-report.log
            verify-demo-data.log
            verify-claims.log
            verify-life-week.log
            verify-ui.log
            verify-publish.log
            verify-e2e.log
            verify-pack.log
            verify-claims.log
            verify-report.md
          if-no-files-found: ignore
          retention-days: 7
