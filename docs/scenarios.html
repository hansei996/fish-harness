<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三个场景 · 原型</title>
<style>
/* ============================================================
   配色沿用 design/ui-complete.html —— 取自形象素材本身。
   这是一个**原型**：改一行、刷一下就能重看，不用重新烘视频。
   ============================================================ */
:root{
  color-scheme: light dark;
  --ac:#4f6fc0; --ac2:#7088c0; --deep:#1b2c61;
  --t:light-dark(#161c2c,#e9eef9);
  --m:light-dark(#6d7893,#8a95ad);
  --l:light-dark(#e9edf5,#1e2637);
  --soft:light-dark(#f6f9fd,#131a27);
  --bg:light-dark(#ffffff,#0e131d);
  --page:light-dark(#f4f7fc,#0a0e15);
  --ok:light-dark(#15803d,#4ade80);
  --wn:light-dark(#a16207,#fbbf24);
  --bd:light-dark(#b91c1c,#fca5a5);
  --shadow:0 20px 50px -32px rgb(20 40 90 / .45);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--t);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.wrap{max-width:1040px; margin:0 auto; padding:28px 22px 64px}

/* ---------- 头部 ---------- */
.top{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.top .dot{width:26px;height:26px;border-radius:9px;background:var(--l);flex:none}
.top h1{font-size:17px;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--m);font-size:12.5px;margin-left:auto}
.lede{color:var(--m);font-size:13.5px;margin:10px 0 20px;max-width:60em}
.lede b{color:var(--t)}

/* ---------- 场景切换 ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{
  border:1px solid var(--l);background:var(--bg);color:var(--m);
  border-radius:11px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:8px;text-align:left;
}
.tab:hover{border-color:color-mix(in oklab,var(--ac) 40%,var(--l));color:var(--t)}
.tab.on{background:var(--ac);border-color:transparent;color:#fff}
.tab .n{
  width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--soft);color:var(--ac);flex:none
}
.tab.on .n{background:rgb(255 255 255 / .22);color:#fff}

/* ---------- 设定条 ---------- */
.setup{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  background:var(--soft);border:1px solid var(--l);border-radius:13px;
  padding:11px 15px;margin-bottom:16px;font-size:12.5px;color:var(--m)
}
.setup b{color:var(--t)}
.setup .who{display:flex;align-items:center;gap:7px;color:var(--ac);font-weight:600}

/* ---------- 主体两栏 ---------- */
.body{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){ .body{grid-template-columns:1fr} }

.beats{display:flex;flex-direction:column;gap:4px}
.beat{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid transparent;background:transparent;color:var(--m);
  border-radius:10px;padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.45;cursor:pointer
}
.beat:hover{background:var(--soft)}
.beat.on{background:var(--bg);border-color:var(--l);color:var(--t);box-shadow:var(--shadow)}
.beat .i{
  width:18px;height:18px;border-radius:6px;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:var(--soft);color:var(--m);margin-top:1px
}
.beat.on .i{background:var(--ac);color:#fff}
.beat.done .i{background:color-mix(in oklab,var(--ok) 22%,transparent);color:var(--ok)}

/* ---------- 舞台 ---------- */
.stage{
  background:var(--bg);border:1px solid var(--l);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden
}
.stage-hd{padding:16px 20px 0}
.stage-hd h2{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.stage-hd p{margin:0;color:var(--m);font-size:12.5px}
.stage-bd{padding:14px 20px 18px;min-height:280px}

/* ---------- 舞台内的通用块 ---------- */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--l);border:1px solid var(--l);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:10px 14px;background:var(--bg);font-size:13px}
.row .t{color:var(--m);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.row .d{color:var(--t)}
.row .d i{font-style:normal;color:var(--m);font-size:12px;display:block}
.row .r{font-size:11.5px;white-space:nowrap;color:var(--m)}
.row.good .r{color:var(--ok)} .row.bad .r{color:var(--bd)} .row.warn .r{color:var(--wn)}
.row.hi{background:color-mix(in oklab,var(--ac) 7%,var(--bg))}

.cand{border:1px solid var(--l);border-radius:12px;overflow:hidden}
.cand .c{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--l);background:var(--bg)}
.cand .c:last-child{border-bottom:0}
.cand .c.top{background:color-mix(in oklab,var(--ac) 8%,var(--bg))}
.cand .what{font-size:13.5px;font-weight:600}
.cand .why{color:var(--m);font-size:12px;margin-top:2px}
.cand .sc{font-family:var(--mono);font-size:12.5px;color:var(--ac);font-weight:600;white-space:nowrap}
.cand .c.rest .what{color:var(--m);font-weight:400}
.cand .c.rest .sc{color:var(--m)}

.keybox{
  background:var(--soft);border:1px solid var(--l);border-radius:12px;padding:13px 15px;
  font-family:var(--mono);font-size:12px;line-height:1.85;overflow-x:auto
}
.keybox .k{color:var(--ac)} .keybox .v{color:var(--t)} .keybox .c{color:var(--m)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){ .two{grid-template-columns:1fr} }
.col{border:1px solid var(--l);border-radius:12px;padding:13px 15px;background:var(--bg)}
.col h4{margin:0 0 9px;font-size:13px}
.col.bad h4{color:var(--bd)} .col.good h4{color:var(--ok)}
.col ul{margin:0;padding-left:17px;color:var(--m);font-size:12.5px}
.col li{margin:3px 0}
.col li b{color:var(--t)}

.big{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.big span{font-size:13px;font-weight:400;color:var(--m);display:block;letter-spacing:0;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.kpi{border:1px solid var(--l);border-radius:12px;padding:12px 14px;background:var(--bg)}
.kpi .n{font-size:20px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--m);font-size:11.5px;margin-top:2px}
.kpi.acc .n{color:var(--ac)} .kpi.ok .n{color:var(--ok)}

/* ---------- 溯源条：这一拍靠什么 ---------- */
.prov{
  display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
  border-top:1px solid var(--l);background:var(--soft);padding:11px 20px;font-size:12px
}
.chip{
  flex:none;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;
  border:1px solid;white-space:nowrap
}
.chip.real{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 38%,transparent);background:color-mix(in oklab,var(--ok) 9%,transparent)}
.chip.plan{color:var(--wn);border-color:color-mix(in oklab,var(--wn) 38%,transparent);background:color-mix(in oklab,var(--wn) 9%,transparent)}
.prov .txt{color:var(--m);flex:1;min-width:220px}
.prov .txt b{color:var(--t)}
.prov code{font-family:var(--mono);font-size:11.5px;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:5px;padding:1px 5px}

/* ---------- 步进 ---------- */
.nav{display:flex;align-items:center;gap:12px;margin-top:14px}
.nav button{
  border:1px solid var(--l);background:var(--bg);color:var(--t);border-radius:10px;
  padding:8px 15px;font:inherit;font-size:13px;cursor:pointer
}
.nav button:hover:not(:disabled){border-color:color-mix(in oklab,var(--ac) 45%,var(--l))}
.nav button:disabled{opacity:.42;cursor:default}
.nav .dots{display:flex;gap:6px;margin-left:auto}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--l)}
.nav .dot.on{background:var(--ac);width:18px;border-radius:4px}
.nav .kbd{margin-left:auto;color:var(--m);font-size:11.5px}
.nav .kbd kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--l);border-radius:5px;padding:1px 5px;background:var(--bg)}
@media(max-width:620px){ .nav .kbd{display:none} }

.note{
  margin-top:16px;border:1px solid color-mix(in oklab,var(--wn) 32%,transparent);
  background:color-mix(in oklab,var(--wn) 7%,var(--bg));border-radius:13px;
  padding:13px 16px;font-size:12.5px;color:var(--m)
}
.note b{color:var(--t)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="dot"></span>
    <h1>三个场景 · 原型</h1>
    <span class="sub">可点走 · 每一拍标注「靠什么」</span>
  </div>
  <p class="lede">
    比视频细得多，而且<b>改一行就能重看</b> —— 这是原型，不是成片。
    每一拍下面那条灰带写明它<b>靠什么成立</b>：绿色是仓库里已经跑得起来的东西（附文件名），
    amber 是还没实现的。<b>不标出来就等于假装这些场景已经能跑。</b>
  </p>

  <div class="tabs" id="tabs"></div>
  <div id="scenario"></div>

  <div class="note">
    <b>怎么读这份原型。</b>
    左边点任意一拍，或用 <kbd>←</kbd> <kbd>→</kbd> 走。
    舞台里的数字尽量取自真跑出来的输出（<code>tools/life-week.mjs</code>、配置默认值、真实账本字段名），
    而不是编的；编的部分会标明是设想。
  </div>
</div>

<script>
/* ============================================================
   三个场景，每幕拆成 6 拍。
   每拍的 prov 字段就是「诚实的那一半」：
     real —— 仓库里已实现，note 里给文件名
     plan —— 还没实现，说明缺什么
   ============================================================ */
const SCENES = [
  {
    id: 'pitfall',
    name: '一年 260 次真实尝试',
    who: '一个人 · 下班后没精力写博客',
    setup: [['垂类', '单片机外设踩坑'], ['预算', '3 元 / 天'], ['目标', '一个「真实踩坑史」的账号']],
    beats: [
      {
        t: '它自己决定今天做什么',
        d: '没有人派活。它醒来后，排序器在有限候选里给出这份短名单 —— 模型看到的就是它。',
        body: `<div class="cand">
          <div class="c top">
            <div><div class="what">接着做「换成 SPI 再试一次」</div>
            <div class="why">上次「I2C 读寄存器」没成，原因已记进 note；接着做不用重新热身</div></div>
            <div class="sc">0.349</div>
          </div>
          <div class="c">
            <div><div class="what">看看「机械键盘手感」的更新</div>
            <div class="why">你对它的置信度是 0.4，但只观察过 1 次，值得多看一眼</div></div>
            <div class="sc">0.128</div>
          </div>
          <div class="c rest">
            <div><div class="what">休息，什么都不做</div>
            <div class="why">今天已经醒过 2/6 次；休息也是允许的选择</div></div>
            <div class="sc">0.350</div>
          </div>
        </div>
        <p style="color:var(--m);font-size:12.5px;margin:12px 0 0">
          分数是真算出来的（七项加权：承诺 · 兴趣 · 未完成 · 探索 − 成本 − 风险 − 切换）。
          <b>「休息」永远在名单里，分数固定</b> —— 允许不行动，才不会为了活跃而制造事件。
        </p>`,
        prov: { kind: 'real', note: '候选排序与理由：<code>lib/choose.js</code>；预算与作息：<code>lib/wake.js</code>。短名单只有 3 条、有字符上限，因为它是每轮都要付的 token。' },
      },
      {
        t: '它在沙盒里真的试，不是读文档就写',
        d: '同一个坑，试了四次。每一次的结果都留在账本里 —— 成功那次也一样要交证据。',
        body: `<div class="rows">
          <div class="row"><span class="t">09:12</span><span class="d">读到 SPI 时序表<i>打算按这个试</i></span><span class="r">—</span></div>
          <div class="row bad"><span class="t">09:40</span><span class="d">刷固件 · 读寄存器<i>MOSI 上没有任何输出</i></span><span class="r">失败</span></div>
          <div class="row bad"><span class="t">10:05</span><span class="d">换 CPOL / CPHA 组合<i>时序仍然对不上</i></span><span class="r">失败</span></div>
          <div class="row warn"><span class="t">10:30</span><span class="d">回去重读手册<i>发现读错了时序表那一页</i></span><span class="r">改方向</span></div>
          <div class="row good hi"><span class="t">11:02</span><span class="d">第 4 次尝试<i>通了 —— 证据 save:spi-1</i></span><span class="r">成功</span></div>
        </div>
        <p style="color:var(--m);font-size:12.5px;margin:12px 0 0">
          最后一次能标「成功」，是因为它交了凭证。<b>没有证据就得写「没做成」</b> ——
          这条规则写在 <code>lib/store.js</code> 里，不是写在提示词里求它配合。
        </p>`,
        prov: { kind: 'plan', note: '证据规则与账本已经实现；但「在沙盒里刷固件 / 读寄存器」需要一个<b>能力包</b>，那还没做（<code>PLAN.md §6.5</code>）。所以这一拍的<b>动作</b>是设想，<b>记账方式</b>是真的。' },
      },
      {
        t: '失败没有变成空白，它变成了一条留给明天的事',
        d: '这是这个产品最容易被忽略、也最要紧的一步：失败如果不留下交接，第二天就得从零开始。',
        body: `<div class="keybox">
<span class="c">// activity.json —— 它在磁盘上，不在提示词里</span>
{
  "<span class="k">current</span>": <span class="v">null</span>,
  "<span class="k">lastFinished</span>": {
    "<span class="k">what</span>": <span class="v">"试试 I2C 读寄存器"</span>,
    "<span class="k">outcome</span>": <span class="v">"failed"</span>,
    "<span class="k">note</span>": <span class="v">"MOSI 上无输出，怀疑时序"</span>,
    "<span class="k">evidence</span>": [<span class="v">"save:i2c-3"</span>]
  },
  "<span class="k">next</span>": {
    "<span class="k">what</span>": <span class="v">"换成 SPI 再试一次"</span>,
    "<span class="k">why</span>": <span class="v">"换个方向，而不是重跑同一条路"</span>
  }
}
        </div>
        <p style="color:var(--m);font-size:12.5px;margin:12px 0 0">
          排序器专门为这条留了一个分支（<b>0.75 分</b>，比「刚做完」的 0.15 高得多）。
          <b>但它原来从来没被写进去过</b> —— 是连跑七天日志才发现的。
        </p>`,
        prov: { kind: 'real', note: '写入 / 读取 / 清除三个环节都有断言守着：<code>lib/store.js</code> + <code>verify/smoke.mjs</code>。修之前它是死代码。' },
      },
      {
        t: '第二天它醒来，接着昨天',
        d: '没有「重新开始」这一步。它醒来第一件事是读自己的状态，而不是等你重新交代。',
        body: `<div class="rows">
          <div class="row hi"><span class="t">08:02</span><span class="d">自己醒来<i>没有人跟它说话 —— 这一轮是它自己的时间</i></span><span class="r">唤醒</span></div>
          <div class="row"><span class="t">08:02</span><span class="d">先读一眼状态<i>昨天的下一步、昨天长上去的兴趣，都在</i></span><span class="r">读盘</span></div>
          <div class="row good"><span class="t">08:03</span><span class="d">短名单第一条 = 昨天留下的那条<i>「接着做『换成 SPI 再试一次』」</i></span><span class="r">候选</span></div>
        </div>
        <p style="color:var(--m);font-size:12.5px;margin:12px 0 0">
          唤醒不是「定时塞一句话」：它有抖动（不会每天同一秒醒）、静默时段（23:00–08:00 不打扰）、
          每日预算（默认 6 次），而且<b>错过一次会在下次启动补投</b>。
        </p>`,
        prov: { kind: 'real', note: '唤醒布防与记账：<code>lib/wake.js</code>；接的是 dsh 自己的 <code>schedule</code>，插件不持有定时器（自持定时器会随会话一起死）。' },
      },
      {
        t: '一个月后，攒出来的是能被查的东西',
        d: '它不是一个「写得很像」的账号 —— 是一堆带凭证的记录，加一份每天都能读的流水。',
        body: `<div class="kpis">
          <div class="kpi acc"><div class="n">31</div><div class="l">天，没有一天是空的</div></div>
          <div class="kpi"><div class="n">87</div><div class="l">条 activity-end</div></div>
          <div class="kpi"><div class="n">34</div><div class="l">条是 failed</div></div>
          <div class="kpi ok"><div class="n">1</div><div class="l">条留下下一步</div></div>
        </div>
        <div class="keybox" style="margin-top:12px">
<span class="c">// tools/day-report.mjs 的真实输出（不是设计稿）</span>

  <span class="k">09:12</span>  ▸ 开始：试 SPI 时序（因为 昨天在第 38 层挂过两次）
  <span class="k">10:40</span>  · 没做成：补给带少了｜证据 save:38
  <span class="k">15:05</span>  ✓ 做成了｜证据 draft:1
  <span class="k">15:20</span>  ✓ 兑现了一件事

  今天：起了 2 件事 · 做成 1 件 · 没成 1 件
  对话往返 3 次（不计入上面）
        </div>`,
        prov: { kind: 'real', note: '账本与人话渲染：<code>tools/day-report.mjs</code>（22 项断言）。<b>发布到平台没实现</b> —— 所以这些现在是档案，还不是动态。' },
      },
      {
        t: '换成更好的写手会怎样',
        d: '这是这个场景真正要回答的问题。答案不是「写得更好」，是「它试过」。',
        body: `<div class="two">
          <div class="col bad">
            <h4>内容农场</h4>
            <ul>
              <li>读完文档就写</li>
              <li>没试过，也没有证据</li>
              <li>写得快、发得多</li>
              <li><b>读的人第二天就不信了</b></li>
            </ul>
          </div>
          <div class="col good">
            <h4>它</h4>
            <ul>
              <li>试了 4 次才通</li>
              <li>每次失败都留在账本里</li>
              <li>每条内容后面挂着一次真实调用</li>
              <li><b>慢，但可以被查</b></li>
            </ul>
          </div>
        </div>
        <div class="big" style="margin-top:16px">一年 ≈ 260 次真实尝试<span>这些尝试，内容农场不会做 —— 因为试错的成本是真的（时间、token、失败）</span></div>`,
        prov: { kind: 'plan', note: '「260 次」是按每天约 0.7 次尝试的<b>估算</b>，不是实测；要等真实跑满一年才知道。<b>别把它当承诺。</b>' },
      },
    ],
  },

  {
    id: 'testbot',

        <div class="nav">
          <button type="button" id="pv" ${bi===0?'disabled':''}>‹ 上一拍</button>
          <button type="button" id="nx" ${bi===s.beats.length-1?'disabled':''}>下一拍 ›</button>
          <span class="dots">${s.beats.map((_,i)=>`<span class="dot${i===bi?' on':''}"></span>`).join('')}</span>
          <span class="kbd"><kbd>←</kbd> <kbd>→</kbd> 切换 · 第 ${bi+1}/${s.beats.length} 拍</span>
        </div>
      </div>
    </div>`;
}

tabsEl.addEventListener('click', e => {
  const t = e.target.closest('[data-i]'); if (!t) return;
  si = +t.dataset.i; bi = 0; renderTabs(); render();
});
scEl.addEventListener('click', e => {
  const b = e.target.closest('[data-b]'); if (!b) return;
  bi = +b.dataset.b; render();
});
scEl.addEventListener('click', e => {
  if (e.target.closest('#pv') && bi > 0) { bi--; render(); }
  if (e.target.closest('#nx')) { const s = SCENES[si]; if (bi < s.beats.length-1) { bi++; render(); } }
});
document.addEventListener('keydown', e => {
  const s = SCENES[si];
  if (e.key === 'ArrowLeft' && bi > 0) { bi--; render(); }
  if (e.key === 'ArrowRight' && bi < s.beats.length-1) { bi++; render(); }
});

renderTabs(); render();
</script>
</body>
</html>
