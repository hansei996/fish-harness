# verify/live overlay — NOT a normal way to run dsh. Read the warning first.
#
# WHY THIS FILE DISABLES THINGS
# -----------------------------
# On dsh 0.2.1-rc.2, creating a Session in the shipped `web` profile fails for
# every shipped preset with:
#
#   agent-preset/invalid
#   persona: prompt section "deployment:persona-prefix" is already registered
#   tool-subagent: standing `modelSelectionSettings` requires a scoped preset Context
#
# The cause is dsh's shipped preset *audit*: each preset tree re-mounts plugins
# that the deployment layer already mounted (persona prompt section, the
# persistent pwsh tool, the compact command), so the audit reports the preset as
# unusable and no Session can be created through any entry point — direct
# service call, Peer RPC, or HTTP. It is a dsh bug, not a property of this repo.
#
# Turning presets off is the smallest way to get a Session at all, and it is a
# DELIBERATE SABOTAGE of the profile for the duration of this check:
#
#   * `agentPreset` is empty: the persona, the preset tool set and the subagent
#     tooling are all absent. What is proved below is the wake path only.
#   * This is not how the desktop GUI composes its profile, so a PASS here says
#     nothing about the GUI.
#
# Remove these six `disabled` rows once the upstream preset audit is fixed; the
# check should then create a Session with the default preset and keep its three
# assertions unchanged.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  disabled: true

# The driver: a relative name is anchored beside this file, so nothing has to be
# published or installed into the profile.
- insert:
    - id: dsh-life-wake-live-probe
      name: ./wake-probe.mjs
