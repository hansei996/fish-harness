# verify/live overlay — one plugin, nothing else. Shipped presets are untouched.
#
# The `web` profile serves HTTP and has no command that runs a turn, so an
# overlay plugin is the only unattended entry point for this check. That is the
# ONLY reason this file exists: it inserts the driver and changes no preset,
# no registry, no service.
#
# HISTORY — read this before re-adding a `disabled` row
# ---------------------------------------------------
# An earlier revision of this file also disabled `preset-standard/ptc/minimal/
# cordis` and `agent-preset-registry`, because every `session/create` in the
# shipped `web` profile failed with:
#
#   agent-preset/invalid
#   persona: prompt section "deployment:persona-prefix" is already registered
#   tool-subagent: standing `modelSelectionSettings` requires a scoped preset Context
#
# That failure was NOT dsh's. It came from one broken local `_dshrt` install
# (a pnpm tree left behind by an `ERR_PNPM_IGNORED_BUILDS` exit-1 install); a
# clean install of the same 0.2.1-rc.2 creates a Session with `agentPreset:
# "standard"` every time. See `docs/dsh-preset-audit.md` for the experiment, the
# line numbers of the audit path, and how to tell a bad install from a real bug.
#
# The disabling was a lie about the product — it implied a companion can only
# wake by giving up the persona, the preset tool set and subagent tooling. It is
# gone. `wake-live.mjs` now refuses to run (exit 2, clearly labelled as an
# environment problem) when the install under test cannot create a Session with
# the shipped `standard` preset.

# The driver: a relative name is anchored beside this file, so nothing has to be
# published or installed into the profile.
- insert:
    - id: dsh-life-wake-live-probe
      name: ./wake-probe.mjs
